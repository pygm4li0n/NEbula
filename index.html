<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08080f" />
<title>NEBULA · live wall</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    margin:0; overflow:hidden; color:#eaeaf2;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    background:#08080f; -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
    font-feature-settings:"ss01","cv01";
  }
  button{font-family:inherit;touch-action:manipulation}

  /* ═══ background ═══ */
  #bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(139,92,246,.16), transparent 60%),
      radial-gradient(900px 600px at 95% 110%, rgba(45,212,191,.11), transparent 60%),
      radial-gradient(700px 500px at 50% 45%, rgba(236,72,153,.06), transparent 70%);
  }
  #bg::after{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 25%, transparent 80%);
    mask-image:radial-gradient(circle at 50% 40%, #000 25%, transparent 80%);
  }

  /* ═══ wall ═══ */
  #wall{
    position:fixed; inset:0; z-index:2;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.1) transparent;
  }
  #wall::-webkit-scrollbar{width:8px}
  #wall::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1); border-radius:9px}

  /* ═══ top bar ═══ */
  #bar{
    position:fixed; top:0; left:0; right:0;
    z-index:9000;
    padding:0 16px;
    height:calc(60px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(180deg, rgba(8,8,15,.95), rgba(8,8,15,.55) 65%, transparent);
    -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid rgba(255,255,255,.04);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; letter-spacing:.3em; font-size:12px; flex-shrink:0;
    color:#fff;
  }
  .orb{
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff, #8b5cf6 50%, #2dd4bf);
    box-shadow:0 0 14px #8b5cf6, 0 0 28px rgba(139,92,246,.5);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}

  #meta{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; color:#8a8aa0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #meta .sep{opacity:.35}
  #meta b{color:#c9c9dd; font-weight:700}

  .right{display:flex; align-items:center; gap:8px; flex-shrink:0}
  .people{display:flex; align-items:center; padding-left:9px}
  .avatar{
    width:26px; height:26px; border-radius:50%; margin-left:-8px;
    display:grid; place-items:center; font-size:10px; font-weight:800;
    border:2px solid #08080f; color:#08080f;
    box-shadow:0 0 10px -2px currentColor;
    animation:pop .3s cubic-bezier(.2,1.5,.4,1);
  }
  .avatar:first-child{margin-left:0}
  .avatar.more{background:#1e1e30 !important; color:#a8a8c0 !important}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  .status{
    display:flex; align-items:center; gap:6px;
    font-size:10.5px; font-weight:700; color:#8a8aa0;
    letter-spacing:.1em; text-transform:uppercase;
    padding:5px 10px; border-radius:99px;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
  }
  .status i{width:6px; height:6px; border-radius:50%; background:#555; transition:.3s}
  .status.live i{background:#34d399; box-shadow:0 0 8px #34d399}
  .status.dead i{background:#f87171; box-shadow:0 0 8px #f87171}

  .btn{
    all:unset; cursor:pointer; font-size:13px; font-weight:600; color:#eaeaf2;
    padding:8px 14px; border-radius:10px; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    transition:.15s; white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.15)}
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(135deg,#8b5cf6,#2dd4bf);
    color:#08080f; border-color:transparent;
    box-shadow:0 6px 22px -8px rgba(139,92,246,.8);
  }
  .btn.primary:hover{box-shadow:0 8px 28px -6px rgba(139,92,246,.9)}
  .btn.icon{padding:8px 10px; font-size:14px; line-height:1}

  /* ═══ notes ═══ */
  .note{
    position:absolute; top:0; left:0;
    padding:12px 14px 12px;
    border-radius:14px;
    background:
      linear-gradient(155deg, var(--c-soft), rgba(11,11,20,.96) 55%),
      rgba(11,11,20,.96);
    border:1px solid var(--c-line);
    box-shadow:
      0 12px 32px -16px rgba(0,0,0,.9),
      0 0 24px -12px var(--c),
      inset 0 1px 0 rgba(255,255,255,.05);
    transition:
      transform .4s cubic-bezier(.22,.9,.25,1),
      box-shadow .22s,
      border-color .22s,
      padding .2s;
    will-change:transform;
    animation:dropIn .42s cubic-bezier(.2,1.3,.4,1) both;
    user-select:none; -webkit-user-select:none;
  }
  @keyframes dropIn{
    from{opacity:0; filter:blur(10px); transform:translate3d(var(--tx),calc(var(--ty) + 8px),0) scale(.9)}
    to  {opacity:1; filter:blur(0);    transform:translate3d(var(--tx),var(--ty),0) scale(1)}
  }
  .note:hover{
    box-shadow:
      0 20px 46px -18px rgba(0,0,0,.95),
      0 0 42px -8px var(--c),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .note.dragging{
    transition:none;
    box-shadow:
      0 44px 90px -26px rgba(0,0,0,1),
      0 0 55px -6px var(--c),
      inset 0 1px 0 rgba(255,255,255,.12);
    border-color:var(--c);
    z-index:5000;
  }
  .note.gone{animation:vanish .26s ease forwards}
  @keyframes vanish{
    to{opacity:0; filter:blur(10px); transform:translate3d(var(--tx),var(--ty),0) scale(.92)}
  }

  /* head: only ~18px tall, always visible */
  .note-head{
    display:flex; align-items:center; gap:7px;
    height:18px; margin-bottom:6px;
    cursor:grab; touch-action:none;
  }
  .note.dragging .note-head{cursor:grabbing}
  .author{display:flex; align-items:center; gap:5px; flex:1; min-width:0}
  .author .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--c); box-shadow:0 0 8px var(--c); flex-shrink:0;
  }
  .author .who{
    font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:var(--c); opacity:.9;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .acts{display:flex; gap:1px; opacity:0; transition:opacity .15s; flex-shrink:0}
  .note:hover .acts, .note.dragging .acts{opacity:1}
  .acts button{
    all:unset; width:18px; height:18px; display:grid; place-items:center;
    cursor:pointer; border-radius:5px; font-size:10px;
    color:#9a9ab5; transition:.12s;
  }
  .acts button:hover{background:rgba(255,255,255,.1); color:#fff}
  .acts .a-del:hover{background:rgba(248,113,113,.2); color:#fca5a5}

  /* body: hugs content, no min-height wasted */
  .body{
    font-size:14.5px; line-height:1.5; color:#f4f4fa;
    white-space:pre-wrap; word-break:break-word;
    outline:none; cursor:text;
    max-height:280px; overflow:auto;
    user-select:text; -webkit-user-select:text;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent;
    min-height:1.5em; /* one line for the placeholder */
  }
  .body::-webkit-scrollbar{width:4px}
  .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:9px}
  .body:empty::before{
    content:"write…"; color:rgba(255,255,255,.2);
    pointer-events:none;
  }

  /* typing strip — sits INSIDE, tight, appears/disappears cleanly */
  .typing-strip{
    display:none;
    align-items:center; gap:7px;
    margin-top:8px; padding:5px 9px;
    border-radius:8px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    font-size:11px; font-weight:500;
    color:#a8a8c0;
    animation:stripIn .22s ease both;
  }
  @keyframes stripIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:translateY(0)}}
  .typing-strip.on{display:flex}
  .typing-strip .who{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .typing-strip .who b{font-weight:800}
  .typing-dots{display:inline-flex; gap:2.5px; align-items:center; flex-shrink:0}
  .typing-dots i{
    width:4.5px; height:4.5px; border-radius:50%; display:block;
    animation:typebob 1.05s ease-in-out infinite;
  }
  .typing-dots i:nth-child(2){animation-delay:.15s}
  .typing-dots i:nth-child(3){animation-delay:.3s}
  @keyframes typebob{
    0%,60%,100%{transform:translateY(0); opacity:.45}
    30%        {transform:translateY(-3.5px); opacity:1}
  }

  /* reactions — compact, hover-only until they exist */
  .react-bar{
    display:none;
    flex-wrap:wrap; gap:4px;
    margin-top:9px; align-items:center;
  }
  .react-bar.on,
  .note:hover .react-bar{display:flex}
  .react-chip{
    all:unset; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 8px 3px; border-radius:99px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.09);
    transition:.14s; font-size:12.5px; line-height:1.15;
    animation:chipIn .25s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes chipIn{from{transform:scale(0); opacity:0}to{transform:scale(1); opacity:1}}
  .react-chip:hover{background:rgba(255,255,255,.12); transform:translateY(-1px)}
  .react-chip b{font-size:10.5px; font-weight:800; color:#c0c0d8}
  .react-chip.mine{
    background:color-mix(in srgb, var(--c) 22%, transparent);
    border-color:color-mix(in srgb, var(--c) 50%, transparent);
  }
  .react-chip.mine b{color:#fff}
  .react-add{
    all:unset; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:99px;
    font-size:13px; font-weight:600; line-height:1;
    color:#7a7a95;
    background:rgba(255,255,255,.04);
    border:1px dashed rgba(255,255,255,.14);
    transition:.15s;
  }
  .react-add:hover{
    color:#fff; background:rgba(255,255,255,.1);
    border-color:var(--c); border-style:solid;
  }

  /* picker — bulletproof */
  .emoji-picker{
    position:fixed; z-index:9700;
    display:flex; flex-wrap:wrap; gap:2px; padding:6px;
    border-radius:14px; max-width:min(320px, 92vw);
    background:rgba(18,18,28,.98);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 55px -14px #000, 0 0 0 1px rgba(139,92,246,.15);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    animation:popIn .16s cubic-bezier(.2,1.5,.4,1);
    touch-action:manipulation;
  }
  @keyframes popIn{from{transform:translateY(6px) scale(.94); opacity:0}to{transform:translateY(0) scale(1); opacity:1}}
  .emoji-picker button{
    all:unset; cursor:pointer;
    width:38px; height:38px; display:grid; place-items:center;
    border-radius:9px; font-size:20px;
    transition:.12s; touch-action:manipulation;
  }
  .emoji-picker button:hover{background:rgba(255,255,255,.12); transform:scale(1.15)}
  .emoji-picker button:active{transform:scale(.9)}

  /* cursors */
  #cursors{position:fixed; inset:0; pointer-events:none; z-index:9500}
  .cursor{
    position:absolute; top:0; left:0; will-change:transform;
    transition:transform .09s linear;
    filter:drop-shadow(0 0 8px currentColor);
  }
  .cursor svg{display:block}
  .cursor .tag{
    position:absolute; left:14px; top:14px;
    padding:2.5px 8px; border-radius:99px;
    font-size:10px; font-weight:800; color:#08080f;
    white-space:nowrap; letter-spacing:.03em;
  }

  /* emoji float */
  .emoji-fly{
    position:fixed; font-size:24px; pointer-events:none; z-index:9600;
    animation:floatUp 1.5s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes floatUp{
    0%  {transform:translate(-50%,-50%) scale(.3); opacity:0}
    18% {transform:translate(-50%,-62%) scale(1.2); opacity:1}
    100%{transform:translate(-50%,-260%) scale(.9); opacity:0}
  }

  /* empty state */
  #hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none; user-select:none;
    transition:opacity .5s; width:min(340px, 90vw); z-index:3;
  }
  #hint.hide{opacity:0}
  #hint h2{
    margin:0 0 10px; font-size:24px; letter-spacing:.02em; font-weight:800;
    background:linear-gradient(120deg,#8b5cf6,#2dd4bf,#ec4899);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #hint p{margin:0; font-size:13px; color:#6a6a86; line-height:1.8}
  #hint kbd{
    font-family:inherit; font-size:11px; font-weight:700;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:5px; padding:2px 7px; margin:0 2px; color:#c0c0d8;
  }

  /* toasts */
  #toasts{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    z-index:9800; display:flex; flex-direction:column; gap:8px;
    align-items:center; pointer-events:none;
    padding-bottom:env(safe-area-inset-bottom);
    max-width:92vw;
  }
  .toast{
    font-size:13px; padding:10px 16px; border-radius:11px; color:#fff;
    background:rgba(30,20,45,.95);
    border:1px solid rgba(248,113,113,.35);
    box-shadow:0 14px 40px -12px #000;
    animation:popIn .25s ease both; text-align:center;
  }

  /* ═══ mobile ═══ */
  @media (max-width: 640px){
    #bar{height:calc(54px + env(safe-area-inset-top)); padding:0 12px; gap:10px}
    .brand{font-size:10.5px; letter-spacing:.22em; gap:8px}
    .brand .orb{width:9px; height:9px}
    #meta{font-size:11px}
    .right{gap:6px}
    .status{display:none}
    .btn{padding:7px 12px; font-size:12.5px; border-radius:9px}
    .btn.icon{padding:7px 9px}
    .avatar{width:24px; height:24px; font-size:9.5px}

    .note{padding:11px 13px 11px}
    .note-head{height:20px; margin-bottom:5px}
    .body{font-size:15px}
    .acts{opacity:1}
    .acts button{width:22px; height:22px; font-size:12px}
    .react-bar{display:flex} /* always visible on mobile */
    .react-chip{padding:3px 9px 4px; font-size:13px}
    .react-add{width:26px; height:26px; font-size:15px}
    .emoji-picker button{width:44px; height:44px; font-size:22px}
    #hint h2{font-size:20px}
    #hint p{font-size:12px}
  }
  @media (max-height: 500px){ #hint{display:none} }
</style>
</head>
<body>

<div id="bg"></div>

<div id="wall">
  <div id="hint">
    <h2>the wall is waiting</h2>
    <p>
      <kbd>N</kbd> · or double-tap · or <strong>+ Note</strong><br>
      drag the header to reorder
    </p>
  </div>
</div>

<div id="cursors"></div>

<header id="bar">
  <div class="brand"><span class="orb"></span> NEBULA</div>
  <div id="meta">
    <span id="metaCount">0 notes</span>
    <span class="sep">·</span>
    <span id="metaLive">connecting…</span>
  </div>
  <div class="right">
    <div class="people" id="people"></div>
    <span class="status" id="status"><i></i><span id="statusText">live</span></span>
    <button class="btn primary" id="add">+ Note</button>
    <button class="btn icon" id="mute" title="Sound">🔊</button>
  </div>
</header>

<div id="toasts"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ════════ config ════════ */
const SUPABASE_URL = 'https://piexelytvvfsoeqhlokb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_neiQC042cfc6Io2r8Cf6hw_WoecdytJ';

/* ════════ helpers ════════ */
const $    = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid  = () => crypto.randomUUID?.() ?? 'id-' + Math.random().toString(36).slice(2) + Date.now();
const hexA = (h, a) => {
  const n = parseInt(h.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
const isMobile = () => innerWidth < 640;

const PALETTE = ['yellow','pink','cyan','green','violet','orange'];
const HEX = {
  yellow:'#ffd93d', pink:'#f472b6', cyan:'#22d3ee',
  green:'#34d399', violet:'#a78bfa', orange:'#fb923c'
};
const NAMES = ['Nova','Comet','Pulsar','Quasar','Orion','Vega','Lyra','Atlas',
               'Rigel','Sirius','Zenith','Cosmo','Astra','Nyx','Echo','Meteor',
               'Phoenix','Hydra','Indigo','Sol','Luna'];
const REACTS = ['✨','🔥','💜','🚀','🎯','💡','😂','👍','❤️','🎉'];

/* ════════ identity ════════ */
let me;
try { me = JSON.parse(sessionStorage.getItem('nebula.me')); } catch {}
if (!me) {
  me = { id: uid(), name: pick(NAMES), color: pick(Object.values(HEX)) };
  sessionStorage.setItem('nebula.me', JSON.stringify(me));
}

/* ════════ state ════════ */
const wall    = $('#wall');
const cursors = $('#cursors');
const notes   = new Map();
let sb, room, zTop = 10;
let cursorTimer = null, cursorBuf = null;
let soundOn = localStorage.getItem('nebula.mute') !== '1';
const typingUsers = new Map();  // userId → { id, name, color, noteId, timer }
const cursorEls = new Map();
let layoutRaf = null;

/* ════════ sound ════════ */
let actx;
function blip(freq = 880, dur = 0.07, type = 'sine', gain = 0.04) {
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const chord = (f, d=0.14) => f.forEach((x,i) => setTimeout(() => blip(x, d), i*22));

/* ════════ toast ════════ */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    setTimeout(() => el.remove(), 320);
  }, 4200);
}

/* ════════ status ════════ */
function setStatus(state) {
  const el = $('#status'), txt = $('#statusText');
  el.classList.remove('live','dead');
  if (state === 'SUBSCRIBED') { el.classList.add('live'); txt.textContent = 'live'; }
  else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT') { el.classList.add('dead'); txt.textContent='offline'; }
  else { txt.textContent = 'connecting'; }
}

/* ════════ layout ════════ */
function computeCols() {
  const gap = 16, side = 16;
  const availW = innerWidth - side * 2;
  const minW = isMobile() ? 240 : 240;
  const maxW = isMobile() ? 480 : 300;
  let cols = Math.max(1, Math.min(5, Math.floor((availW + gap) / (minW + gap))));
  let colW = Math.floor((availW - gap * (cols - 1)) / cols);
  while (cols > 1 && colW > maxW) {
    cols--;
    colW = Math.floor((availW - gap * (cols - 1)) / cols);
  }
  const totalW = cols * colW + (cols - 1) * gap;
  const startX = Math.max(side, (innerWidth - totalW) / 2);
  const topY = ($('#bar').offsetHeight || 60) + 20;
  return { gap, cols, colW, startX, topY };
}

function layoutNow(opts = {}) {
  const { floatingId = null, insertIndex = -1 } = opts;
  const L = computeCols();

  const sorted = [...notes.values()]
    .filter(e => e.data.id !== floatingId)
    .sort((a, b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));

  let items = sorted;
  if (floatingId && insertIndex >= 0) {
    const dragged = notes.get(floatingId);
    const ph = dragged ? dragged.el.offsetHeight : 0;
    items = [...sorted.slice(0, insertIndex), { _phantom: true, h: ph }, ...sorted.slice(insertIndex)];
  }

  const colY = new Array(L.cols).fill(L.topY);
  let maxBottom = 0;

  for (const item of items) {
    let c = 0;
    for (let i = 1; i < L.cols; i++) if (colY[i] < colY[c]) c = i;
    const x = L.startX + c * (L.colW + L.gap);
    const y = colY[c];

    if (item._phantom) { colY[c] = y + item.h + L.gap; continue; }

    const entry = item;
    if (entry.el.style.width !== L.colW + 'px') entry.el.style.width = L.colW + 'px';
    const h = entry.el.offsetHeight;

    entry._layoutX = x;
    entry._layoutY = y;

    if (!entry.el.classList.contains('dragging')) {
      setPos(entry.el, x, y);
    }

    colY[c] = y + h + L.gap;
    maxBottom = Math.max(maxBottom, y + h);
  }

  wall.style.minHeight = Math.max(innerHeight, maxBottom + 80) + 'px';
  updateMeta();
}

function layoutAll(opts = {}) {
  if (layoutRaf) cancelAnimationFrame(layoutRaf);
  layoutRaf = requestAnimationFrame(() => {
    layoutRaf = null;
    layoutNow(opts);
  });
}

function computeInsertIndex(clientY, floatingId) {
  const sorted = [...notes.values()]
    .filter(e => e.data.id !== floatingId)
    .sort((a, b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));
  for (let i = 0; i < sorted.length; i++) {
    const rect = sorted[i].el.getBoundingClientRect();
    if (clientY < rect.top + rect.height / 2) return i;
  }
  return sorted.length;
}

/* ════════ note render ════════ */
function setPos(el, x, y, rot = 0) {
  el.style.setProperty('--tx', x + 'px');
  el.style.setProperty('--ty', y + 'px');
  el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
}

function renderNote(entry) {
  const { el, data } = entry;
  const hex = HEX[data.color] || HEX.yellow;
  el.style.setProperty('--c', hex);
  el.style.setProperty('--c-soft', hexA(hex, .12));
  el.style.setProperty('--c-line', hexA(hex, .38));

  const body = el.querySelector('.body');
  const text = data.text || '';
  if (document.activeElement !== body && body.innerText !== text) body.innerText = text;

  el.querySelector('.who').textContent = data.author || '?';

  renderReactions(entry);
  renderTypingStrip(entry);
}

function createNoteEl(data) {
  const el = document.createElement('article');
  el.className = 'note';
  el.dataset.id = data.id;
  el.innerHTML = `
    <header class="note-head">
      <div class="author"><span class="dot"></span><span class="who"></span></div>
      <div class="acts">
        <button class="a-color" title="Recolour">◐</button>
        <button class="a-del"   title="Delete">✕</button>
      </div>
    </header>
    <div class="body" contenteditable="true" spellcheck="false"></div>
    <div class="typing-strip"></div>
    <footer class="react-bar"></footer>
  `;
  return el;
}

function upsertNote(row) {
  let entry = notes.get(row.id);
  let isNew = false;
  if (!entry) {
    const el = createNoteEl(row);
    wall.appendChild(el);
    entry = { el, data: { ...row } };
    notes.set(row.id, entry);
    wireNote(entry);
    isNew = true;
    updateEmpty();
  } else {
    Object.assign(entry.data, row);
  }
  renderNote(entry);
  if (isNew) {
    entry.el.style.animation = 'dropIn .42s cubic-bezier(.2,1.3,.4,1) both';
  }
  layoutAll();
}

function dropNote(id) {
  const entry = notes.get(id);
  if (!entry) return;
  notes.delete(id);
  // clear typing for that note
  typingUsers.forEach((v, k) => {
    if (v.noteId === id) { clearTimeout(v.timer); typingUsers.delete(k); }
  });
  const el = entry.el;
  const rect = el.getBoundingClientRect();
  el.style.setProperty('--tx', rect.left + 'px');
  el.style.setProperty('--ty', rect.top + 'px');
  el.style.pointerEvents = 'none';
  el.classList.add('gone');
  setTimeout(() => { el.remove(); updateEmpty(); layoutAll(); }, 260);
  updateEmpty();
  layoutAll();
}

const updateEmpty = () => $('#hint').classList.toggle('hide', notes.size > 0);
const bringFront  = entry => entry.el.style.zIndex = ++zTop;

function updateMeta() {
  const n = notes.size;
  $('#metaCount').textContent = n === 0 ? 'empty' : n + (n === 1 ? ' note' : ' notes');
}

/* ════════ reactions ════════ */
function renderReactions(entry) {
  const bar = entry.el.querySelector('.react-bar');
  const openFor = document.querySelector(`.emoji-picker[data-note-id="${entry.data.id}"]`);
  if (openFor) return; // don't rebuild under an open picker

  const r = entry.data.reactions || {};
  const hasAny = Object.values(r).some(a => Array.isArray(a) && a.length);
  bar.classList.toggle('on', hasAny);

  bar.innerHTML = '';
  Object.entries(r).forEach(([emoji, users]) => {
    if (!Array.isArray(users) || !users.length) return;
    const mine = users.includes(me.id);
    const btn = document.createElement('button');
    btn.className = 'react-chip' + (mine ? ' mine' : '');
    btn.innerHTML = `<span>${emoji}</span><b>${users.length}</b>`;
    btn.onclick = e => { e.stopPropagation(); toggleReaction(entry.data.id, emoji); };
    bar.appendChild(btn);
  });

  const add = document.createElement('button');
  add.className = 'react-add';
  add.type = 'button';
  add.textContent = '+';
  add.title = 'Add reaction';
  add.onclick = e => { e.stopPropagation(); openPicker(entry, add); };
  bar.appendChild(add);
}

async function toggleReaction(noteId, emoji) {
  const entry = notes.get(noteId);
  if (!entry) return;

  const reactions = { ...(entry.data.reactions || {}) };
  const arr = Array.isArray(reactions[emoji]) ? [...reactions[emoji]] : [];
  const i = arr.indexOf(me.id);
  const added = i < 0;
  if (added) arr.push(me.id); else arr.splice(i, 1);
  if (arr.length) reactions[emoji] = arr; else delete reactions[emoji];

  entry.data.reactions = reactions;
  renderReactions(entry);
  layoutAll();

  if (added) { burst(entry, emoji); blip(720 + Math.random() * 220, 0.06, 'triangle', 0.04); }
  else blip(420, 0.05, 'sine', 0.03);

  const { error } = await sb.from('notes').update({ reactions }).eq('id', noteId);
  if (error) {
    toast(/reactions/i.test(error.message)
      ? 'Run the SQL — missing `reactions` column.'
      : error.message);
  }
}

/* ════════ picker ════════ */
function openPicker(entry, anchor) {
  const existing = document.querySelector(`.emoji-picker[data-note-id="${entry.data.id}"]`);
  if (existing) { closePicker(); return; }
  closePicker();

  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.dataset.noteId = entry.data.id;
  picker.addEventListener('pointerdown', e => e.stopPropagation());

  REACTS.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = em;
    // fire on pointerdown for instant, race-free response
    b.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      const noteId = picker.dataset.noteId;
      closePicker();
      toggleReaction(noteId, em);
    });
    picker.appendChild(b);
  });

  document.body.appendChild(picker);

  const r  = anchor.getBoundingClientRect();
  const pw = picker.offsetWidth  || 260;
  const ph = picker.offsetHeight || 44;
  let left = r.left + r.width / 2 - pw / 2;
  let top  = r.top - ph - 8;
  left = Math.max(8, Math.min(innerWidth  - pw - 8, left));
  if (top < ($('#bar').offsetHeight || 60) + 6) top = r.bottom + 8;
  if (top + ph > innerHeight - 8) top = innerHeight - ph - 8;
  picker.style.left = left + 'px';
  picker.style.top  = top  + 'px';

  setTimeout(() => {
    const closeOnOutside = e => {
      if (e.target.closest('.emoji-picker')) return;
      if (e.target.closest('.react-add'))     return;
      closePicker();
    };
    document.addEventListener('pointerdown', closeOnOutside);
    picker._closeHandler = closeOnOutside;
  }, 0);
}

function closePicker() {
  document.querySelectorAll('.emoji-picker').forEach(p => {
    if (p._closeHandler) document.removeEventListener('pointerdown', p._closeHandler);
    p.remove();
  });
}

/* ════════ bursts ════════ */
function burst(entry, emoji) {
  const rect = entry.el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const fly = document.createElement('div');
  fly.className = 'emoji-fly';
  fly.textContent = emoji;
  fly.style.left = cx + 'px';
  fly.style.top  = cy + 'px';
  document.body.appendChild(fly);
  setTimeout(() => fly.remove(), 1600);
}

/* ════════ typing — robust ════════ */
function renderTypingStrip(entry) {
  const strip = entry.el.querySelector('.typing-strip');
  if (!strip) return;

  const users = [...typingUsers.values()]
    .filter(u => u.noteId === entry.data.id && u.id !== me.id);

  if (!users.length) {
    if (strip.classList.contains('on')) {
      strip.classList.remove('on');
      strip.innerHTML = '';
      requestAnimationFrame(() => layoutAll());
    }
    return;
  }

  const color = users[0].color;
  const names = users.slice(0, 2).map(u => `<b style="color:${u.color}">${u.name}</b>`);
  const more  = users.length > 2 ? ` +${users.length - 2}` : '';
  const label = users.length === 1
    ? `${names[0]} is typing`
    : `${names.join(' & ')}${more} are typing`;

  strip.classList.add('on');
  strip.innerHTML = `
    <span class="typing-dots">
      <i style="background:${color};box-shadow:0 0 6px ${color}"></i>
      <i style="background:${color};box-shadow:0 0 6px ${color}"></i>
      <i style="background:${color};box-shadow:0 0 6px ${color}"></i>
    </span>
    <span class="who">${label}</span>
  `;
  requestAnimationFrame(() => layoutAll());
}

function markTyping(p) {
  // p = { id, name, color, noteId }
  const prev = typingUsers.get(p.id);
  if (prev?.timer) clearTimeout(prev.timer);

  const timer = setTimeout(() => {
    typingUsers.delete(p.id);
    renderAllTyping();
  }, 2400);

  typingUsers.set(p.id, { ...p, timer });
  renderAllTyping();
}

function renderAllTyping() {
  notes.forEach(e => renderTypingStrip(e));
}

/* ════════ wire note ════════ */
function wireNote(entry) {
  const { el, data } = entry;
  const head = el.querySelector('.note-head');
  const body = el.querySelector('.body');

  el.addEventListener('pointerdown', () => bringFront(entry), true);

  /* ── drag to reorder ── */
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (document.activeElement !== body) e.preventDefault();
    bringFront(entry);

    try { head.setPointerCapture(e.pointerId); } catch {}

    const startX = e.clientX, startY = e.clientY;
    const origX = entry._layoutX ?? 0, origY = entry._layoutY ?? 0;

    const currentSorted = [...notes.values()]
      .sort((a,b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));
    let currentIndex = currentSorted.findIndex(x => x.data.id === data.id);

    el.classList.add('dragging');
    el.style.transition = 'none';

    layoutNow({ floatingId: data.id, insertIndex: currentIndex });

    let lastX = startX;

    const onMove = ev => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      const vx = ev.clientX - lastX; lastX = ev.clientX;
      const rot = Math.max(-3.5, Math.min(3.5, vx * 0.28));
      setPos(el, origX + dx, origY + dy, rot);

      const idx = computeInsertIndex(ev.clientY, data.id);
      if (idx !== currentIndex) {
        currentIndex = idx;
        layoutNow({ floatingId: data.id, insertIndex: idx });
      }
    };

    const onUp = async () => {
      head.removeEventListener('pointermove', onMove);
      head.removeEventListener('pointerup', onUp);
      head.removeEventListener('pointercancel', onUp);
      el.classList.remove('dragging');
      el.style.transition = '';
      setPos(el, origX, origY, 0);

      const others = [...notes.values()]
        .filter(x => x.data.id !== data.id)
        .sort((a,b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));

      let newOrder;
      if (currentIndex >= others.length) {
        const last = others[others.length - 1];
        newOrder = last ? (last.data.sort_order ?? 0) + 1 : 1;
      } else if (currentIndex === 0) {
        const first = others[0];
        newOrder = first ? (first.data.sort_order ?? 0) - 1 : 1;
      } else {
        const a = others[currentIndex - 1].data.sort_order ?? 0;
        const b = others[currentIndex].data.sort_order ?? 0;
        newOrder = (a + b) / 2;
      }

      data.sort_order = newOrder;
      layoutAll();

      const { error } = await sb.from('notes').update({ sort_order: newOrder }).eq('id', data.id);
      if (error) toast(error.message);
    };

    head.addEventListener('pointermove', onMove);
    head.addEventListener('pointerup', onUp);
    head.addEventListener('pointercancel', onUp);
  });

  /* ── editing ── */
  body.addEventListener('keydown', e => { if (e.key === 'Escape') body.blur(); });
  body.addEventListener('focus', () => bringFront(entry));

  let lastPing = 0;
  body.addEventListener('input', () => {
    layoutAll();
    const now = Date.now();
    if (now - lastPing < 400) return;
    lastPing = now;
    if (!room) return;
    room.send({
      type: 'broadcast',
      event: 'note-typing',
      payload: {
        id: me.id,
        name: me.name,
        color: me.color,
        noteId: data.id
      }
    });
  });

  body.addEventListener('blur', async () => {
    const text = body.innerText.replace(/\n{3,}/g, '\n\n').trim();
    if (!text) return removeNote(data.id);
    if (text === (data.text || '')) { body.innerText = text; return; }
    data.text = text;
    body.innerText = text;
    layoutAll();
    const { error } = await sb.from('notes').update({ text }).eq('id', data.id);
    if (error) toast(error.message);
  });

  /* ── colour ── */
  el.querySelector('.a-color').onclick = async e => {
    e.stopPropagation();
    const i = PALETTE.indexOf(data.color);
    const next = PALETTE[(i + 1) % PALETTE.length];
    data.color = next;
    renderNote(entry);
    blip(560, 0.05, 'triangle', 0.03);
    const { error } = await sb.from('notes').update({ color: next }).eq('id', data.id);
    if (error) toast(error.message);
  };

  /* ── delete ── */
  el.querySelector('.a-del').onclick = e => { e.stopPropagation(); removeNote(data.id); };
}

async function removeNote(id) {
  dropNote(id);
  blip(300, 0.09, 'sine', 0.03);
  const { error } = await sb.from('notes').delete().eq('id', id);
  if (error) toast(error.message);
}

/* ════════ create ════════ */
async function addNote() {
  const color = pick(PALETTE);
  const now = Date.now() / 1000;
  const { data, error } = await sb.from('notes')
    .insert({ text:'', color, author: me.name, sort_order: now, x: 0, y: 0 })
    .select().single();
  if (error) return toast(error.message);
  chord([660, 880, 1100], 0.08);
  upsertNote(data);
  bringFront(notes.get(data.id));
  setTimeout(() => {
    const body = notes.get(data.id)?.el.querySelector('.body');
    if (body) body.focus();
  }, 140);
}

$('#add').onclick = () => addNote();

document.addEventListener('dblclick', e => {
  if (e.target.closest('.note, .emoji-picker, #bar')) return;
  addNote();
});

/* mobile double-tap */
let lastTap = 0, lastTapX = 0, lastTapY = 0;
document.addEventListener('touchend', e => {
  if (!isMobile()) return;
  if (e.target.closest('.note, .emoji-picker, #bar, button')) return;
  const t = e.changedTouches[0]; if (!t) return;
  const now = Date.now();
  if (now - lastTap < 320 && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 40) {
    addNote(); lastTap = 0;
  } else { lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY; }
}, { passive: true });

addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); addNote(); }
  if (e.key === 'Escape') closePicker();
});

/* mute */
const muteBtn = $('#mute');
const paintMute = () => muteBtn.textContent = soundOn ? '🔊' : '🔇';
muteBtn.onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem('nebula.mute', soundOn ? '0' : '1');
  paintMute();
  if (soundOn) blip(880, 0.07);
};
paintMute();

/* ════════ cursor broadcast ════════ */
addEventListener('pointermove', e => {
  if (!room) return;
  cursorBuf = { id: me.id, name: me.name, color: me.color, x: e.clientX, y: e.clientY };
  if (cursorTimer) return;
  cursorTimer = setTimeout(() => {
    cursorTimer = null;
    if (cursorBuf) { room.send({ type:'broadcast', event:'cursor', payload: cursorBuf }); cursorBuf = null; }
  }, 55);
}, { passive: true });

/* ════════ draw cursor ════════ */
function drawCursor(p) {
  if (p.id === me.id) return;
  let el = cursorEls.get(p.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'cursor';
    el.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M4 2l6.6 18 2.6-7.6L21 10z" fill="currentColor"
              stroke="rgba(0,0,0,.5)" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <span class="tag"></span>`;
    cursors.appendChild(el);
    cursorEls.set(p.id, el);
  }
  el.style.color = p.color;
  el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`;
  const tag = el.querySelector('.tag');
  tag.textContent = p.name;
  tag.style.background = p.color;
  clearTimeout(el._kill);
  el._kill = setTimeout(() => { el.remove(); cursorEls.delete(p.id); }, 7000);
}

/* ════════ presence ════════ */
function renderPeople() {
  if (!room) return;
  const users = Object.values(room.presenceState()).flat();
  const box = $('#people');
  box.innerHTML = '';
  const max = isMobile() ? 3 : 5;

  users.slice(0, max).forEach(u => {
    const d = document.createElement('div');
    d.className = 'avatar';
    d.style.background = u.color || '#888';
    d.textContent = (u.name || '?')[0].toUpperCase();
    d.title = u.name || '';
    box.appendChild(d);
  });
  if (users.length > max) {
    const d = document.createElement('div');
    d.className = 'avatar more';
    d.textContent = '+' + (users.length - max);
    box.appendChild(d);
  }
  $('#metaLive').innerHTML = users.length === 1
    ? `you are <b>${me.name}</b>`
    : `<b>${users.length}</b> people here`;
}

/* ════════ boot ════════ */
async function boot() {
  const url = SUPABASE_URL.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  sb = createClient(url, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 25 } } });

  const probe = await sb.from('notes').select('id,reactions,sort_order').limit(1);
  if (probe.error) {
    if (/reactions/i.test(probe.error.message)) toast('Missing `reactions` column — run the SQL.');
    if (/sort_order/i.test(probe.error.message)) toast('Missing `sort_order` column — run the SQL.');
  }

  const { data, error } = await sb.from('notes').select('*').order('sort_order', { ascending:true });
  if (error) { toast('DB error: ' + error.message); console.error(error); return; }
  data.forEach(upsertNote);
  updateEmpty();
  layoutAll();

  /* ── postgres realtime ── */
  sb.channel('nebula-db')
    .on('postgres_changes', { event:'*', schema:'public', table:'notes' }, payload => {
      if (payload.eventType === 'DELETE') dropNote(payload.old.id);
      else upsertNote(payload.new);
    })
    .subscribe();

  /* ── presence + broadcast ── */
  room = sb.channel('nebula-room', { config: { presence: { key: me.id } } });
  room
    .on('presence', { sync: () => renderPeople() })
    .on('broadcast', { event:'cursor' }, ({ payload }) => drawCursor(payload))
    .on('broadcast', { event:'note-typing' }, ({ payload }) => {
      // ignore own typing echoes
      if (payload.id === me.id) return;
      // only accept if we have that note locally
      if (!notes.has(payload.noteId)) return;
      markTyping(payload);
    })
    .subscribe(async status => {
      setStatus(status);
      if (status === 'SUBSCRIBED') {
        await room.track({ id: me.id, name: me.name, color: me.color });
        renderPeople();
      }
    });

  addEventListener('beforeunload', () => room?.untrack());

  /* ── resize ── */
  let rzT;
  addEventListener('resize', () => {
    closePicker();
    clearTimeout(rzT);
    rzT = setTimeout(() => layoutAll(), 80);
  });

  document.addEventListener('scroll', closePicker, true);
}

boot();
</script>
</body>
</html>
