<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06060c" />
<title>NEBULA · live wall</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    margin:0; overflow:hidden; color:#ececf5;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    background:#06060c; -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
  }
  button{font-family:inherit;touch-action:manipulation}
  input{font-family:inherit}

  /* ═══ background ═══ */
  #aurora{
    position:fixed; inset:-20%; pointer-events:none; z-index:0; opacity:.55;
    background:
      radial-gradient(600px 300px at 20% 30%, rgba(140,90,255,.28), transparent 60%),
      radial-gradient(700px 400px at 75% 65%, rgba(0,210,255,.20), transparent 60%),
      radial-gradient(500px 250px at 50% 85%, rgba(255,90,180,.18), transparent 60%);
    filter:blur(70px);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%  {transform:translate3d(-2%,-2%,0) rotate(0)}
    100%{transform:translate3d(2%,3%,0) rotate(6deg)}
  }
  #grid{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 85%);
    mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 85%);
  }

  /* ═══ wall ═══ */
  #wall{
    position:fixed; inset:0; z-index:2;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.12) transparent;
  }
  #wall::-webkit-scrollbar{width:8px}
  #wall::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:9px}
  #wall::-webkit-scrollbar-track{background:transparent}

  /* ═══ top bar ═══ */
  #bar{
    position:fixed; top:0; left:0; right:0;
    height:60px; padding:0 14px;
    z-index:9000; display:flex; align-items:center; gap:12px;
    background:linear-gradient(180deg, rgba(6,6,12,.94), rgba(6,6,12,.4) 70%, transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    padding-top:env(safe-area-inset-top);
    height:calc(60px + env(safe-area-inset-top));
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.24em; font-size:13px; flex-shrink:0}
  .orb{
    width:13px; height:13px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #fff, #8b5cff 45%, #4dd4ff);
    box-shadow:0 0 16px #8b5cff, 0 0 34px rgba(139,92,255,.6);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.24);opacity:.72}}

  #ticker{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:12.5px; font-weight:600; color:#a9a9c6;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transform:translateY(-4px);
    transition:opacity .3s, transform .3s;
    pointer-events:none;
  }
  #ticker.show{opacity:1; transform:translateY(0)}
  #ticker .dot{width:5px; height:5px; border-radius:50%; background:#8b5cff; box-shadow:0 0 8px #8b5cff; flex-shrink:0}

  .right{display:flex; align-items:center; gap:8px; flex-shrink:0}
  .people{display:flex; align-items:center}
  .avatar{
    width:28px; height:28px; border-radius:50%; margin-left:-9px;
    display:grid; place-items:center; font-size:11px; font-weight:800;
    border:2px solid #0b0b14; color:#07070d;
    box-shadow:0 0 12px -2px currentColor;
    animation:pop .3s cubic-bezier(.2,1.5,.4,1);
  }
  .avatar:first-child{margin-left:0}
  .avatar.more{background:#23233a !important; color:#c9c9e0 !important}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  .status{
    display:flex; align-items:center; gap:7px;
    font-size:11px; font-weight:700; color:#8b8ba7;
    letter-spacing:.08em; text-transform:uppercase;
    padding:6px 11px; border-radius:99px;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08);
  }
  .status i{width:7px; height:7px; border-radius:50%; background:#666; transition:.3s}
  .status.live i{background:#3ce88a; box-shadow:0 0 10px #3ce88a}
  .status.dead i{background:#ff5c7a; box-shadow:0 0 10px #ff5c7a}

  .btn{
    all:unset; cursor:pointer; font-size:13px; font-weight:700; color:#ececf5;
    padding:9px 14px; border-radius:11px; text-align:center;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    transition:.16s; white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.12); transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.primary{
    background:linear-gradient(140deg,#8b5cff,#4dd4ff);
    color:#07070d; border-color:transparent;
    box-shadow:0 8px 26px -10px #8b5cff;
  }
  .btn.icon{padding:9px 11px; font-size:14px; line-height:1}

  /* ═══ notes ═══ */
  .note{
    position:absolute; top:0; left:0;
    padding:11px 13px 12px;
    border-radius:16px;
    background:linear-gradient(155deg, var(--c-soft), rgba(9,9,17,.92));
    border:1px solid var(--c-line);
    box-shadow:
      0 14px 36px -18px rgba(0,0,0,.95),
      0 0 30px -14px var(--c),
      inset 0 1px 0 rgba(255,255,255,.06);
    transition:
      transform .38s cubic-bezier(.2,.8,.3,1),
      box-shadow .22s,
      border-color .22s,
      opacity .3s;
    will-change:transform;
    animation:dropIn .42s cubic-bezier(.2,1.4,.35,1) both;
    user-select:none; -webkit-user-select:none;
  }
  @keyframes dropIn{from{opacity:0; filter:blur(10px)}to{opacity:1; filter:blur(0)}}
  .note:hover{
    box-shadow:
      0 22px 48px -20px rgba(0,0,0,1),
      0 0 46px -10px var(--c),
      inset 0 1px 0 rgba(255,255,255,.08);
    border-color:var(--c);
  }
  .note.dragging{
    transition:none;
    box-shadow:
      0 42px 90px -26px rgba(0,0,0,1),
      0 0 60px -8px var(--c),
      inset 0 1px 0 rgba(255,255,255,.12);
    border-color:var(--c);
    z-index:5000;
  }
  .note.gone{animation:vanish .28s ease forwards}
  @keyframes vanish{
    to{opacity:0; filter:blur(10px); transform:scale(.9) translate(var(--tx),var(--ty))}
  }
  .note.fresh{animation:popIn .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes popIn{
    0%  {opacity:0; transform:translate3d(var(--tx),var(--ty),0) scale(.7); filter:blur(10px)}
    60% {opacity:1; filter:blur(0)}
    100%{opacity:1; transform:translate3d(var(--tx),var(--ty),0) scale(1)}
  }

  .note-head{
    display:flex; align-items:center; gap:8px; height:24px;
    cursor:grab; touch-action:none;
  }
  .note.dragging .note-head{cursor:grabbing}
  .author{display:flex; align-items:center; gap:6px; flex:1; min-width:0}
  .author .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--c); box-shadow:0 0 10px var(--c); flex-shrink:0;
  }
  .author .who{
    font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--c); opacity:.95;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .acts{display:flex; gap:1px; opacity:0; transition:opacity .16s; flex-shrink:0}
  .note:hover .acts, .note.dragging .acts{opacity:1}
  .acts button{
    all:unset; width:22px; height:22px; display:grid; place-items:center;
    cursor:pointer; border-radius:6px; font-size:11px;
    color:#d3d3e6; transition:.14s;
  }
  .acts button:hover{background:rgba(255,255,255,.16); color:#fff}
  .acts .a-del:hover{background:rgba(255,80,110,.3); color:#ff8098}

  .body{
    margin:6px 0 0;
    font-size:14px; line-height:1.5; color:#f5f5fd;
    white-space:pre-wrap; word-break:break-word;
    outline:none; cursor:text;
    min-height:26px; max-height:300px; overflow:auto;
    user-select:text; -webkit-user-select:text;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;
  }
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:9px}
  .body:empty::before{content:"type something…"; color:rgba(255,255,255,.22); pointer-events:none}

  /* typing strip INSIDE note */
  .typing-strip{
    display:none;
    align-items:center; gap:6px;
    margin-top:8px; padding:5px 9px;
    border-radius:9px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
    font-size:11px; font-weight:600;
    animation:popIn .3s ease both;
  }
  .typing-strip.on{display:flex}
  .typing-strip .who{color:#c9c9e0}
  .typing-strip .who b{font-weight:800}
  .typing-dots{display:inline-flex; gap:3px; align-items:center}
  .typing-dots i{
    width:5px; height:5px; border-radius:50%;
    animation:typebob 1.05s ease-in-out infinite;
  }
  .typing-dots i:nth-child(2){animation-delay:.15s}
  .typing-dots i:nth-child(3){animation-delay:.3s}
  @keyframes typebob{
    0%,60%,100%{transform:translateY(0); opacity:.5}
    30%        {transform:translateY(-4px); opacity:1}
  }

  /* reactions */
  .react-bar{
    display:flex; flex-wrap:wrap; gap:5px;
    margin-top:10px; min-height:24px; align-items:center;
  }
  .react-chip{
    all:unset; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px 4px; border-radius:99px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    transition:.15s; font-size:13px;
    animation:chipIn .3s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes chipIn{from{transform:scale(0); opacity:0}to{transform:scale(1); opacity:1}}
  .react-chip:hover{background:rgba(255,255,255,.14); transform:translateY(-1px)}
  .react-chip b{font-size:11px; font-weight:800; color:#cfcfe6}
  .react-chip.mine{
    background:color-mix(in srgb, var(--c) 26%, transparent);
    border-color:color-mix(in srgb, var(--c) 60%, transparent);
  }
  .react-chip.mine b{color:#fff}
  .react-add{
    all:unset; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:99px;
    font-size:15px; font-weight:600; line-height:1;
    color:#8b8ba7;
    background:rgba(255,255,255,.05);
    border:1px dashed rgba(255,255,255,.18);
    transition:.15s;
  }
  .react-add:hover{
    color:#fff; background:rgba(255,255,255,.13);
    border-color:var(--c); border-style:solid;
  }

  /* picker */
  .emoji-picker{
    position:fixed; z-index:9700;
    display:flex; flex-wrap:wrap; gap:2px; padding:7px;
    border-radius:16px; max-width:min(340px, 92vw);
    background:rgba(20,20,32,.97);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 24px 60px -14px #000;
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    animation:popIn .18s cubic-bezier(.2,1.5,.4,1);
  }
  .emoji-picker button{
    all:unset; cursor:pointer;
    width:38px; height:38px; display:grid; place-items:center;
    border-radius:10px; font-size:21px; transition:.12s;
  }
  .emoji-picker button:hover{background:rgba(255,255,255,.14); transform:scale(1.14)}
  .emoji-picker button:active{transform:scale(.9)}

  /* cursors */
  #cursors{position:fixed; inset:0; pointer-events:none; z-index:9500}
  .cursor{
    position:absolute; top:0; left:0; will-change:transform;
    transition:transform .09s linear;
    filter:drop-shadow(0 0 8px currentColor);
  }
  .cursor svg{display:block}
  .cursor .tag{
    position:absolute; left:15px; top:15px;
    padding:2.5px 8px; border-radius:99px;
    font-size:10px; font-weight:800; color:#07070d;
    white-space:nowrap; letter-spacing:.03em;
  }

  /* emoji float */
  .emoji-fly{
    position:fixed; font-size:26px; pointer-events:none; z-index:9600;
    animation:floatUp 1.6s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes floatUp{
    0%  {transform:translate(-50%,-50%) scale(.3); opacity:0}
    18% {transform:translate(-50%,-62%) scale(1.25); opacity:1}
    100%{transform:translate(-50%,-260%) scale(.9); opacity:0}
  }
  .spark{
    position:fixed; width:6px; height:6px; border-radius:50%;
    pointer-events:none; z-index:9550;
    animation:spark .72s ease-out forwards;
  }
  @keyframes spark{
    0%  {transform:translate(-50%,-50%) scale(1); opacity:1}
    100%{transform:translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(0); opacity:0}
  }

  /* empty state */
  #hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none; user-select:none;
    transition:opacity .5s; width:min(340px, 90vw); z-index:3;
  }
  #hint.hide{opacity:0}
  #hint h2{
    margin:0 0 10px; font-size:26px; letter-spacing:.04em; font-weight:800;
    background:linear-gradient(120deg,#8b5cff,#4dd4ff,#ff6b9d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hue 6s linear infinite;
  }
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  #hint p{margin:0; font-size:13px; color:#6a6a86; line-height:1.7}
  #hint kbd{
    font-family:inherit; font-size:11px; font-weight:700;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:5px; padding:1px 6px; margin:0 2px; color:#c9c9e0;
  }

  /* toasts */
  #toasts{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    z-index:9800; display:flex; flex-direction:column; gap:8px;
    align-items:center; pointer-events:none;
    padding-bottom:env(safe-area-inset-bottom);
    max-width:92vw;
  }
  .toast{
    font-size:13px; padding:10px 16px; border-radius:12px; color:#fff;
    background:rgba(30,20,45,.94);
    border:1px solid rgba(255,120,150,.35);
    box-shadow:0 14px 40px -12px #000;
    animation:popIn .25s ease both; text-align:center;
  }

  /* ═══ mobile ═══ */
  @media (max-width: 640px){
    #bar{height:calc(56px + env(safe-area-inset-top)); padding:0 10px; gap:8px}
    .brand{font-size:11px; letter-spacing:.16em; gap:7px}
    .brand .orb{width:11px; height:11px}
    #ticker{font-size:11.5px}
    .right{gap:6px}
    .status{display:none}
    .btn{padding:8px 12px; font-size:12.5px; border-radius:10px}
    .btn.icon{padding:8px 10px}
    .avatar{width:26px; height:26px; font-size:10px}
    .note{padding:10px 12px 11px; border-radius:14px}
    .note-head{height:26px}
    .body{font-size:15px; max-height:38vh}
    .acts{opacity:1}
    .acts button{width:26px; height:26px; font-size:13px}
    .react-chip{padding:4px 10px 5px; font-size:14px}
    .react-add{width:30px; height:30px; font-size:17px}
    .emoji-picker button{width:44px; height:44px; font-size:24px}
    #hint h2{font-size:20px}
    #hint p{font-size:12px}
  }
  @media (max-height: 500px){ #hint{display:none} }
</style>
</head>
<body>

<div id="aurora"></div>
<div id="grid"></div>

<div id="wall">
  <div id="hint">
    <h2>the wall is waiting</h2>
    <p>
      <kbd>N</kbd> · or double-tap · or <strong>+ Note</strong><br>
      drag the top of a note to reorder
    </p>
  </div>
</div>

<div id="cursors"></div>

<header id="bar">
  <div class="brand"><span class="orb"></span> NEBULA</div>
  <div id="ticker"><span class="dot"></span><span id="tickerText"></span></div>
  <div class="right">
    <div class="people" id="people"></div>
    <span class="status" id="status"><i></i><span id="statusText">connecting</span></span>
    <button class="btn primary" id="add">+ Note</button>
    <button class="btn icon" id="mute" title="Sound">🔊</button>
  </div>
</header>

<div id="toasts"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ════════════════ config ════════════════ */
const SUPABASE_URL = 'https://piexelytvvfsoeqhlokb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_neiQC042cfc6Io2r8Cf6hw_WoecdytJ';

/* ════════════════ helpers ════════════════ */
const $    = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid  = () => crypto.randomUUID?.() ?? 'id-' + Math.random().toString(36).slice(2) + Date.now();
const hexA = (h, a) => {
  const n = parseInt(h.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
const isMobile = () => innerWidth < 640;

const PALETTE = ['yellow','pink','cyan','green','violet','orange'];
const HEX = {
  yellow:'#ffd93d', pink:'#ff6b9d', cyan:'#4dd4ff',
  green:'#6bff9d', violet:'#b28dff', orange:'#ffa94d'
};
const NAMES = ['Nova','Comet','Pulsar','Quasar','Orion','Vega','Lyra','Atlas',
               'Rigel','Sirius','Zenith','Cosmo','Astra','Nyx','Echo','Meteor',
               'Phoenix','Hydra','Indigo','Sol','Luna'];
const REACTS = ['✨','🔥','💜','🚀','🎯','💡','😂','👍','❤️','🎉'];

/* ════════════════ identity ════════════════ */
let me;
try { me = JSON.parse(sessionStorage.getItem('nebula.me')); } catch {}
if (!me) {
  me = { id: uid(), name: pick(NAMES), color: pick(Object.values(HEX)) };
  sessionStorage.setItem('nebula.me', JSON.stringify(me));
}

/* ════════════════ state ════════════════ */
const wall    = $('#wall');
const cursors = $('#cursors');
const notes   = new Map();
let sb, room, zTop = 10;
let moveTimer=null, cursorTimer=null, cursorBuf=null;
let soundOn = localStorage.getItem('nebula.mute') !== '1';
const typingUsers = new Map();
const cursorEls = new Map();
let layoutRaf = null;

/* ════════════════ sound ════════════════ */
let actx;
function blip(freq = 880, dur = 0.07, type = 'sine', gain = 0.045) {
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const chord = (f, d=0.14) => f.forEach((x,i) => setTimeout(() => blip(x, d), i*22));

/* ════════════════ toast + ticker ════════════════ */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    setTimeout(() => el.remove(), 320);
  }, 4200);
}
let tickTimer;
function tick(html) {
  $('#tickerText').innerHTML = html;
  const el = $('#ticker');
  el.classList.add('show');
  clearTimeout(tickTimer);
  tickTimer = setTimeout(() => el.classList.remove('show'), 3600);
}

/* ════════════════ status ════════════════ */
function setStatus(state) {
  const el = $('#status'), txt = $('#statusText');
  el.classList.remove('live','dead');
  if (state === 'SUBSCRIBED') { el.classList.add('live'); txt.textContent = 'live'; }
  else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT') { el.classList.add('dead'); txt.textContent='offline'; }
  else { txt.textContent = 'connecting'; }
}

/* ════════════════ layout engine ════════════════ */
function computeCols() {
  const gap = 16;
  const sideGap = 16;
  const availW = innerWidth - sideGap * 2;
  const minColW = isMobile() ? 260 : 250;
  const maxColW = isMobile() ? 420 : 320;
  let cols = Math.max(1, Math.min(4, Math.floor((availW + gap) / (minColW + gap))));
  let colW = Math.floor((availW - gap * (cols - 1)) / cols);
  while (cols > 1 && colW > maxColW) {
    cols--;
    colW = Math.floor((availW - gap * (cols - 1)) / cols);
  }
  const totalW = cols * colW + (cols - 1) * gap;
  const startX = Math.max(sideGap, (innerWidth - totalW) / 2);
  const topY = ($('#bar').offsetHeight || 60) + 16;
  return { gap, cols, colW, startX, topY };
}

let lastLayout = { maxY: 0 };
function layoutAll(opts = {}) {
  if (layoutRaf) cancelAnimationFrame(layoutRaf);
  layoutRaf = requestAnimationFrame(() => {
    layoutRaf = null;
    doLayout(opts);
  });
}

function doLayout(opts = {}) {
  const { floatingId = null, insertIndex = -1 } = opts;
  const L = computeCols();

  const sorted = [...notes.values()]
    .filter(e => e.data.id !== floatingId)
    .sort((a, b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));

  let items = sorted;
  if (floatingId && insertIndex >= 0) {
    const dragged = notes.get(floatingId);
    const ph = dragged ? dragged.el.offsetHeight : 0;
    items = [...sorted.slice(0, insertIndex), { _phantom: true, h: ph }, ...sorted.slice(insertIndex)];
  }

  const colY = new Array(L.cols).fill(L.topY);
  let maxBottom = 0;

  for (const item of items) {
    let c = 0;
    for (let i = 1; i < L.cols; i++) if (colY[i] < colY[c]) c = i;
    const x = L.startX + c * (L.colW + L.gap);
    const y = colY[c];

    if (item._phantom) { colY[c] = y + item.h + L.gap; continue; }

    const entry = item;
    if (entry.el.style.width !== L.colW + 'px') entry.el.style.width = L.colW + 'px';
    const h = entry.el.offsetHeight;

    entry._layoutX = x;
    entry._layoutY = y;
    entry._layoutW = L.colW;

    if (!entry.el.classList.contains('dragging')) {
      setPos(entry.el, x, y);
    }

    colY[c] = y + h + L.gap;
    maxBottom = Math.max(maxBottom, y + h);
  }

  lastLayout.maxY = maxBottom;
  wall.style.minHeight = Math.max(innerHeight, maxBottom + 80) + 'px';
}

function computeInsertIndex(clientY, floatingId) {
  const sorted = [...notes.values()]
    .filter(e => e.data.id !== floatingId)
    .sort((a, b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));
  for (let i = 0; i < sorted.length; i++) {
    const rect = sorted[i].el.getBoundingClientRect();
    const cy = rect.top + rect.height / 2;
    if (clientY < cy) return i;
  }
  return sorted.length;
}

/* ════════════════ note render ════════════════ */
function setPos(el, x, y, rot = 0) {
  el.style.setProperty('--tx', x + 'px');
  el.style.setProperty('--ty', y + 'px');
  el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
}

function renderNote(entry) {
  const { el, data } = entry;
  const hex = HEX[data.color] || HEX.yellow;
  el.style.setProperty('--c', hex);
  el.style.setProperty('--c-soft', hexA(hex, .13));
  el.style.setProperty('--c-line', hexA(hex, .42));

  const body = el.querySelector('.body');
  const text = data.text || '';
  if (document.activeElement !== body && body.innerText !== text) body.innerText = text;

  el.querySelector('.who').textContent = data.author || '?';

  renderReactions(entry);
  renderTypingStrip(entry);
}

function createNoteEl(data) {
  const el = document.createElement('article');
  el.className = 'note';
  el.dataset.id = data.id;
  el.innerHTML = `
    <header class="note-head">
      <div class="author"><span class="dot"></span><span class="who"></span></div>
      <div class="acts">
        <button class="a-color" title="Recolour">◐</button>
        <button class="a-del"   title="Delete">✕</button>
      </div>
    </header>
    <div class="body" contenteditable="true" spellcheck="false"></div>
    <div class="typing-strip"></div>
    <footer class="react-bar"></footer>
  `;
  return el;
}

function upsertNote(row) {
  let entry = notes.get(row.id);
  let isNew = false;
  if (!entry) {
    const el = createNoteEl(row);
    wall.appendChild(el);
    entry = { el, data: { ...row } };
    notes.set(row.id, entry);
    wireNote(entry);
    isNew = true;
    updateEmpty();
  } else {
    Object.assign(entry.data, row);
  }
  renderNote(entry);
  if (isNew) {
    entry.el.classList.add('fresh');
    setTimeout(() => entry.el.classList.remove('fresh'), 600);
  }
  layoutAll();
}

function dropNote(id) {
  const entry = notes.get(id);
  if (!entry) return;
  notes.delete(id);
  typingUsers.forEach((v, k) => { if (v.noteId === id) { clearTimeout(v.timer); typingUsers.delete(k); } });
  const el = entry.el;
  const rect = el.getBoundingClientRect();
  el.style.setProperty('--tx', rect.left + 'px');
  el.style.setProperty('--ty', rect.top + 'px');
  el.style.pointerEvents = 'none';
  el.classList.add('gone');
  setTimeout(() => { el.remove(); updateEmpty(); }, 280);
  updateEmpty();
  layoutAll();
}

const updateEmpty = () => $('#hint').classList.toggle('hide', notes.size > 0);
const bringFront  = entry => entry.el.style.zIndex = ++zTop;

/* ════════════════ reactions ════════════════ */
function renderReactions(entry) {
  const bar = entry.el.querySelector('.react-bar');
  const openFor = document.querySelector('.emoji-picker');
  if (openFor && openFor.dataset.noteId === entry.data.id) return;

  const r = entry.data.reactions || {};
  bar.innerHTML = '';

  Object.entries(r).forEach(([emoji, users]) => {
    if (!Array.isArray(users) || !users.length) return;
    const mine = users.includes(me.id);
    const btn = document.createElement('button');
    btn.className = 'react-chip' + (mine ? ' mine' : '');
    btn.innerHTML = `<span>${emoji}</span><b>${users.length}</b>`;
    btn.onclick = e => { e.stopPropagation(); toggleReaction(entry.data.id, emoji); };
    bar.appendChild(btn);
  });

  const add = document.createElement('button');
  add.className = 'react-add';
  add.type = 'button';
  add.textContent = '+';
  add.title = 'Add reaction';
  add.onclick = e => { e.stopPropagation(); openPicker(entry, add); };
  bar.appendChild(add);
}

async function toggleReaction(noteId, emoji) {
  const entry = notes.get(noteId);
  if (!entry) return;

  const reactions = { ...(entry.data.reactions || {}) };
  const arr = Array.isArray(reactions[emoji]) ? [...reactions[emoji]] : [];
  const i = arr.indexOf(me.id);
  const added = i < 0;
  if (added) arr.push(me.id); else arr.splice(i, 1);
  if (arr.length) reactions[emoji] = arr; else delete reactions[emoji];

  entry.data.reactions = reactions;
  renderReactions(entry);

  if (added) { burst(entry, emoji); blip(720 + Math.random() * 220, 0.06, 'triangle', 0.04); }
  else blip(420, 0.05, 'sine', 0.03);

  const { error } = await sb.from('notes').update({ reactions }).eq('id', noteId);
  if (error) {
    toast(/reactions/i.test(error.message)
      ? 'Run the SQL — missing `reactions` column.'
      : error.message);
  }
  // re-layout (heights may have changed)
  layoutAll();
}

/* ════════════════ picker — FIXED ════════════════ */
function openPicker(entry, anchor) {
  const existing = document.querySelector(`.emoji-picker[data-note-id="${entry.data.id}"]`);
  if (existing) { closePicker(); return; }
  closePicker();

  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.dataset.noteId = entry.data.id;

  // kill pointer events from bubbling to document
  picker.addEventListener('pointerdown', e => e.stopPropagation());

  REACTS.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = em;
    // use pointerdown for instant response, no click delay
    b.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      toggleReaction(entry.data.id, em);
      closePicker();
    });
    picker.appendChild(b);
  });

  document.body.appendChild(picker);

  // position
  const r  = anchor.getBoundingClientRect();
  const pw = picker.offsetWidth  || 260;
  const ph = picker.offsetHeight || 44;
  let left = r.left + r.width / 2 - pw / 2;
  let top  = r.top - ph - 10;
  left = Math.max(8, Math.min(innerWidth  - pw - 8, left));
  if (top < ($('#bar').offsetHeight || 60) + 6) top = r.bottom + 10;
  if (top + ph > innerHeight - 8) top = innerHeight - ph - 8;
  picker.style.left = left + 'px';
  picker.style.top  = top  + 'px';

  // close on outside pointerdown — added AFTER current event loop, bubble phase
  setTimeout(() => {
    const closeOnOutside = e => {
      if (e.target.closest('.emoji-picker')) return;
      if (e.target.closest('.react-add'))     return;
      document.removeEventListener('pointerdown', closeOnOutside);
      closePicker();
    };
    document.addEventListener('pointerdown', closeOnOutside);
    picker._closeHandler = closeOnOutside;
  }, 0);
}
function closePicker() {
  document.querySelectorAll('.emoji-picker').forEach(p => {
    if (p._closeHandler) document.removeEventListener('pointerdown', p._closeHandler);
    p.remove();
  });
}

/* ════════════════ bursts ════════════════ */
function burst(entry, emoji) {
  const rect = entry.el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const fly = document.createElement('div');
  fly.className = 'emoji-fly';
  fly.textContent = emoji;
  fly.style.left = cx + 'px';
  fly.style.top  = cy + 'px';
  document.body.appendChild(fly);
  setTimeout(() => fly.remove(), 1700);

  const hex = HEX[entry.data.color] || '#fff';
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = cx + 'px';
    p.style.top  = cy + 'px';
    p.style.background = hex;
    p.style.boxShadow = `0 0 10px ${hex}`;
    const ang = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
    const dist = 34 + Math.random() * 26;
    p.style.setProperty('--bx', Math.cos(ang) * dist + 'px');
    p.style.setProperty('--by', Math.sin(ang) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 780);
  }
}

/* ════════════════ typing (inside note) ════════════════ */
function renderTypingStrip(entry) {
  const strip = entry.el.querySelector('.typing-strip');
  const users = [...typingUsers.values()].filter(u => u.noteId === entry.data.id && u.id !== me.id);
  if (!users.length) { strip.classList.remove('on'); strip.innerHTML = ''; return; }

  const names = users.slice(0, 3).map(u => `<b style="color:${u.color}">${u.name}</b>`).join(', ');
  const more = users.length > 3 ? ` +${users.length - 3}` : '';
  const verb = users.length === 1 ? 'is' : 'are';

  strip.classList.add('on');
  strip.innerHTML = `
    <span class="typing-dots">
      <i style="background:${users[0].color}; box-shadow:0 0 8px ${users[0].color}"></i>
      <i style="background:${users[0].color}; box-shadow:0 0 8px ${users[0].color}"></i>
      <i style="background:${users[0].color}; box-shadow:0 0 8px ${users[0].color}"></i>
    </span>
    <span class="who">${names}${more} ${verb} typing…</span>
  `;
}
function renderTypingAll() { notes.forEach(renderTypingStrip); }

function markTyping(payload) {
  const existing = typingUsers.get(payload.id);
  if (existing?.timer) clearTimeout(existing.timer);
  const timer = setTimeout(() => {
    typingUsers.delete(payload.id);
    renderTypingAll();
    layoutAll();
  }, 2200);
  typingUsers.set(payload.id, { ...payload, timer });
  renderTypingAll();
  layoutAll();
}

/* ════════════════ wire note ════════════════ */
function wireNote(entry) {
  const { el, data } = entry;
  const head = el.querySelector('.note-head');
  const body = el.querySelector('.body');

  el.addEventListener('pointerdown', () => bringFront(entry), true);

  /* ── drag → reorder ── */
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (document.activeElement !== body) e.preventDefault();
    bringFront(entry);

    try { head.setPointerCapture(e.pointerId); } catch {}

    const startX = e.clientX, startY = e.clientY;
    const origX = entry._layoutX ?? 0, origY = entry._layoutY ?? 0;

    // current index from sort_order
    const currentSorted = [...notes.values()].sort((a,b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));
    let currentIndex = currentSorted.findIndex(x => x.data.id === data.id);

    el.classList.add('dragging');
    el.style.transition = 'none';

    // re-layout with phantom gap where it currently sits
    doLayout({ floatingId: data.id, insertIndex: currentIndex });

    let lastX = startX;

    const onMove = ev => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      const vx = ev.clientX - lastX; lastX = ev.clientX;
      const rot = Math.max(-4, Math.min(4, vx * 0.3));
      setPos(el, origX + dx, origY + dy, rot);

      const idx = computeInsertIndex(ev.clientY, data.id);
      if (idx !== currentIndex) {
        currentIndex = idx;
        doLayout({ floatingId: data.id, insertIndex: idx });
      }
    };

    const onUp = async () => {
      head.removeEventListener('pointermove', onMove);
      head.removeEventListener('pointerup', onUp);
      head.removeEventListener('pointercancel', onUp);
      el.classList.remove('dragging');
      el.style.transition = '';
      setPos(el, origX, origY, 0);

      // commit new sort_order
      const others = [...notes.values()]
        .filter(x => x.data.id !== data.id)
        .sort((a,b) => (a.data.sort_order ?? 0) - (b.data.sort_order ?? 0));

      let newOrder;
      if (currentIndex >= others.length) {
        const last = others[others.length - 1];
        newOrder = last ? (last.data.sort_order ?? 0) + 1 : 1;
      } else if (currentIndex === 0) {
        const first = others[0];
        newOrder = first ? (first.data.sort_order ?? 0) - 1 : 1;
      } else {
        const a = others[currentIndex - 1].data.sort_order ?? 0;
        const b = others[currentIndex].data.sort_order ?? 0;
        newOrder = (a + b) / 2;
      }

      data.sort_order = newOrder;
      layoutAll();

      const { error } = await sb.from('notes').update({ sort_order: newOrder }).eq('id', data.id);
      if (error) toast(error.message);
    };

    head.addEventListener('pointermove', onMove);
    head.addEventListener('pointerup', onUp);
    head.addEventListener('pointercancel', onUp);
  });

  /* ── edit ── */
  body.addEventListener('keydown', e => { if (e.key === 'Escape') body.blur(); });
  body.addEventListener('focus', () => bringFront(entry));

  let lastTyped = 0;
  body.addEventListener('input', () => {
    const now = Date.now();
    if (now - lastTyped > 300) {
      lastTyped = now;
      room?.send({
        type: 'broadcast', event: 'typing',
        payload: { id: me.id, name: me.name, color: me.color, noteId: data.id }
      });
    }
  });

  body.addEventListener('blur', async () => {
    const text = body.innerText.replace(/\n{3,}/g, '\n\n').trim();
    if (!text) return removeNote(data.id);
    if (text === (data.text || '')) { body.innerText = text; return; }
    data.text = text;
    body.innerText = text;
    layoutAll();
    const { error } = await sb.from('notes').update({ text }).eq('id', data.id);
    if (error) toast(error.message);
    else tick(`<b style="color:${HEX[data.color]}">${data.author}</b> edited a note`);
  });

  /* ── colour ── */
  el.querySelector('.a-color').onclick = async e => {
    e.stopPropagation();
    const i = PALETTE.indexOf(data.color);
    const next = PALETTE[(i + 1) % PALETTE.length];
    data.color = next;
    renderNote(entry);
    blip(560, 0.05, 'triangle', 0.03);
    const { error } = await sb.from('notes').update({ color: next }).eq('id', data.id);
    if (error) toast(error.message);
  };

  /* ── delete ── */
  el.querySelector('.a-del').onclick = e => { e.stopPropagation(); removeNote(data.id); };
}

async function removeNote(id) {
  dropNote(id);
  blip(300, 0.09, 'sine', 0.035);
  const { error } = await sb.from('notes').delete().eq('id', id);
  if (error) toast(error.message);
}

/* ════════════════ create ════════════════ */
async function addNote() {
  const color = pick(PALETTE);
  const now = Date.now() / 1000;
  const { data, error } = await sb.from('notes')
    .insert({ text:'', color, author: me.name, sort_order: now, x: 0, y: 0 })
    .select().single();
  if (error) return toast(error.message);
  chord([660, 880, 1100], 0.08);
  upsertNote(data);
  bringFront(notes.get(data.id));
  tick(`<b style="color:${HEX[color]}">${me.name}</b> dropped a note`);
  setTimeout(() => {
    const body = notes.get(data.id)?.el.querySelector('.body');
    if (body) body.focus();
  }, 120);
}

$('#add').onclick = () => addNote();

document.addEventListener('dblclick', e => {
  if (e.target.closest('.note, .emoji-picker, #bar')) return;
  addNote();
});

/* mobile double-tap */
let lastTap = 0, lastTapX = 0, lastTapY = 0;
document.addEventListener('touchend', e => {
  if (!isMobile()) return;
  if (e.target.closest('.note, .emoji-picker, #bar, button')) return;
  const t = e.changedTouches[0]; if (!t) return;
  const now = Date.now();
  if (now - lastTap < 320 && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 40) {
    addNote(); lastTap = 0;
  } else { lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY; }
}, { passive: true });

addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); addNote(); }
  if (e.key === 'Escape') closePicker();
});

/* mute */
const muteBtn = $('#mute');
const paintMute = () => muteBtn.textContent = soundOn ? '🔊' : '🔇';
muteBtn.onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem('nebula.mute', soundOn ? '0' : '1');
  paintMute();
  if (soundOn) blip(880, 0.07);
};
paintMute();

/* ════════════════ broadcasts ════════════════ */
addEventListener('pointermove', e => {
  if (!room) return;
  cursorBuf = { id: me.id, name: me.name, color: me.color, x: e.clientX, y: e.clientY };
  if (cursorTimer) return;
  cursorTimer = setTimeout(() => {
    cursorTimer = null;
    if (cursorBuf) { room.send({ type:'broadcast', event:'cursor', payload: cursorBuf }); cursorBuf = null; }
  }, 55);
}, { passive: true });

/* ════════════════ cursors ════════════════ */
function drawCursor(p) {
  if (p.id === me.id) return;
  let el = cursorEls.get(p.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'cursor';
    el.innerHTML = `
      <svg width="19" height="19" viewBox="0 0 24 24">
        <path d="M4 2l6.6 18 2.6-7.6L21 10z" fill="currentColor"
              stroke="rgba(0,0,0,.45)" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <span class="tag"></span>`;
    cursors.appendChild(el);
    cursorEls.set(p.id, el);
  }
  el.style.color = p.color;
  el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`;
  const tag = el.querySelector('.tag');
  tag.textContent = p.name;
  tag.style.background = p.color;
  clearTimeout(el._kill);
  el._kill = setTimeout(() => { el.remove(); cursorEls.delete(p.id); }, 7000);
}

/* ════════════════ presence ════════════════ */
let lastUsers = 0;
function renderPeople() {
  if (!room) return;
  const users = Object.values(room.presenceState()).flat();
  const box = $('#people');
  box.innerHTML = '';
  const max = isMobile() ? 3 : 6;

  users.slice(0, max).forEach(u => {
    const d = document.createElement('div');
    d.className = 'avatar';
    d.style.background = u.color || '#888';
    d.textContent = (u.name || '?')[0].toUpperCase();
    d.title = u.name || '';
    box.appendChild(d);
  });
  if (users.length > max) {
    const d = document.createElement('div');
    d.className = 'avatar more';
    d.textContent = '+' + (users.length - max);
    box.appendChild(d);
  }
  if ($('#status').classList.contains('live')) $('#statusText').textContent = users.length + ' here';

  if (users.length > lastUsers && lastUsers > 0) {
    const newest = users.find(u => u.id !== me.id);
    if (newest) tick(`<b style="color:${newest.color}">${newest.name}</b> joined`);
  }
  lastUsers = users.length;
}

/* ════════════════ boot ════════════════ */
async function boot() {
  const url = SUPABASE_URL.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  sb = createClient(url, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 25 } } });

  const probe = await sb.from('notes').select('id,reactions,sort_order').limit(1);
  if (probe.error) {
    if (/reactions/i.test(probe.error.message)) toast('Missing `reactions` column — run the SQL.');
    if (/sort_order/i.test(probe.error.message)) toast('Missing `sort_order` column — run the SQL.');
  }

  const { data, error } = await sb.from('notes').select('*').order('sort_order', { ascending:true });
  if (error) { toast('DB error: ' + error.message); console.error(error); return; }
  data.forEach(upsertNote);
  updateEmpty();
  layoutAll();

  /* rows realtime */
  sb.channel('nebula-db')
    .on('postgres_changes', { event:'*', schema:'public', table:'notes' }, payload => {
      if (payload.eventType === 'DELETE') dropNote(payload.old.id);
      else upsertNote(payload.new);
    })
    .subscribe();

  /* presence + broadcast */
  room = sb.channel('nebula-room', { config: { presence: { key: me.id } } });
  room
    .on('presence', { event:'sync' }, renderPeople)
    .on('broadcast', { event:'cursor' }, ({ payload }) => drawCursor(payload))
    .on('broadcast', { event:'typing' }, ({ payload }) => markTyping(payload))
    .subscribe(async status => {
      setStatus(status);
      if (status === 'SUBSCRIBED') {
        await room.track({ id: me.id, name: me.name, color: me.color, at: Date.now() });
        renderPeople();
        tick(`you are <b style="color:${me.color}">${me.name}</b>`);
      }
    });

  addEventListener('beforeunload', () => room?.untrack());

  /* resize → re-layout */
  let rzT;
  addEventListener('resize', () => {
    closePicker();
    clearTimeout(rzT);
    rzT = setTimeout(() => layoutAll(), 80);
  });

  document.addEventListener('scroll', closePicker, true);
}

boot();
</script>
